name: Build iOS and Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_ios_android:
    name: Compilar App iOS
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Precache artefatos iOS
        run: flutter precache --ios

       - name: Limpar e Recriar arquivos nativos iOS e dependências
         run: |
              test -f pubspec.yaml || { echo "pubspec.yaml não encontrado; confira o diretório de trabalho"; exit 1; }
          
              flutter create --platforms=ios --org br.com.assistec .
          
              flutter pub get
          
              test -f ios/Podfile || {
                echo "flutter create não gerou ios/Podfile"
                ls -la ios || true
                exit 1
              }
          
              test -f ios/Flutter/Generated.xcconfig || {
                echo "ios/Flutter/Generated.xcconfig não foi gerado"
                exit 1
              }
          
              cd ios
              pod install --repo-update

      - name: Compilar iOS (sem assinatura para teste)
        run: flutter build ios --release --no-codesign

      - name: Empacotar IPA e ZIP para Sideload no iPhone
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Assistec-iOS.ipa Payload
          cd build/ios/iphoneos && zip -r Runner.zip Runner.app && mv Runner.zip ../../

      - name: Upload dos Artefatos iOS
        uses: actions/upload-artifact@v4
        with:
          name: assistec-mobile-ios-artifacts
          path: |
            Assistec-iOS.ipa
            Runner.zip
