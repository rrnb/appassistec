name: Build iOS and Android

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build_flutter:
    name: Compilar App Flutter
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile

    env:
      FLUTTER_VERSION: "3.24.5"
      JAVA_VERSION: "17"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validar estrutura do projeto
        shell: bash
        run: |
          set -e
          test -f pubspec.yaml || { echo "pubspec.yaml não encontrado"; exit 1; }
          flutter --version
          flutter doctor -v

      - name: Instalar dependências do Flutter
        shell: bash
        run: |
          set -e
          flutter pub get

      - name: Preparar projeto iOS
        shell: bash
        run: |
          set -e
          flutter precache --ios

          if [ ! -f ios/Podfile ]; then
            echo "Podfile não encontrado. Gerando estrutura iOS..."
            flutter create --platforms=ios --org br.com.assistec . --overwrite
          fi

          if [ ! -f ios/Podfile ]; then
            echo "Erro: ios/Podfile ainda não foi gerado."
            ls -la ios || true
            exit 1
          fi

          cd ios
          pod install --repo-update

      - name: Compilar iOS (sem assinatura para teste)
        shell: bash
        run: |
          set -e
          flutter build ios --release --no-codesign

      - name: Empacotar artefatos iOS
        shell: bash
        run: |
          set -e
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Assistec-iOS.ipa Payload
          cd build/ios/iphoneos
          zip -r Runner.zip Runner.app
          mv Runner.zip ../../

      - name: Compilar Android (APK release)
        shell: bash
        run: |
          set -e
          flutter build apk --release

      - name: Upload dos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: assistec-mobile-build-artifacts
          path: |
            Assistec-iOS.ipa
            Runner.zip
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
