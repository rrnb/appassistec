name: Build iOS (Assistec Mobile)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar App iOS (macOS Runner)
    runs-on: macos-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache artefatos iOS
        run: flutter precache --ios

      - name: Limpar e Recriar arquivos nativos iOS e dependências
        working-directory: ./mobile
        run: |
          echo "Removendo pasta ios antiga..."
          rm -rf ios
          
          echo "Recriando plataforma iOS limpa..."
          flutter create . --org br.com.assistec --platforms=ios
          
          echo "Adicionando permissões de câmera e fotos no Info.plist..."
          plutil -insert NSCameraUsageDescription -string "O Assistec precisa da câmera para fotos de vistorias e lacres." ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryUsageDescription -string "Acesso à galeria para anexar fotos de evidências." ios/Runner/Info.plist || true

          echo "Baixando dependências do Dart..."
          flutter pub get
          
          echo "Gerando Podfile e configurando CocoaPods sem checagem de assinatura..."
          flutter build ios --config-only --no-codesign
          
          if [ -f "ios/Podfile" ]; then
            echo "Executando pod install para sincronizar sandbox..."
            cd ios
            pod install
            cd ..
          fi

      - name: Compilar iOS (sem assinatura para teste)
        working-directory: ./mobile
        run: flutter build ios --release --no-codesign

      - name: Empacotar IPA para Sideload / Instalação no iPhone
        working-directory: ./mobile
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Assistec-iOS.ipa Payload
          cd build/ios/iphoneos && zip -r Runner.zip Runner.app && mv Runner.zip ../../

      - name: Upload iOS App e IPA como Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: assistec-mobile-ios-app
          path: |
            mobile/Assistec-iOS.ipa
            mobile/Runner.zip
