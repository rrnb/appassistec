name: Build iOS & Android (Assistec Mobile)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências
        working-directory: ./mobile
        run: flutter pub get

      - name: Compilar APK Release
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: assistec-mobile-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Compilar App iOS (macOS Runner)
    runs-on: macos-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências
        working-directory: ./mobile
        run: flutter pub get

      - name: Compilar iOS (sem assinatura para teste/emulador)
        working-directory: ./mobile
        run: flutter build ios --release --no-codesign

      - name: Compactar App iOS em ZIP
        working-directory: ./mobile/build/ios/iphoneos
        run: zip -r Runner.zip Runner.app

      - name: Upload iOS App como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: assistec-mobile-ios-app
          path: mobile/build/ios/iphoneos/Runner.zip
