name: Build iOS and Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_ios_android:
    name: Compilar App iOS e Android
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java (necessário para o Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Precache artefatos iOS e Android
        run: flutter precache --ios --android

      - name: Limpar e Recriar arquivos nativos iOS e dependências
        run: |
          echo "Removendo pastas nativas antigas..."
          rm -rf ios android
          
          echo "Recriando plataformas nativas (iOS e Android)..."
          flutter create . --org br.com.assistec --platforms=ios,android
          
          echo "Baixando dependências do Dart..."
          flutter pub get
          
          echo "Gerando Podfile e configurando CocoaPods sem checagem de assinatura..."
          cd ios
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj
          pod install --repo-update || pod install
          
          # IMPORTANTE: Volta para a raiz do projeto para o próximo passo achar o pubspec.yaml
          cd ..

      - name: Compilar iOS (sem assinatura para teste)
        run: flutter build ios --release --no-codesign

      - name: Empacotar IPA e ZIP para Sideload no iPhone
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Assistec-iOS.ipa Payload
          cd build/ios/iphoneos && zip -r Runner.zip Runner.app && mv Runner.zip ../../

      - name: Compilar Android (APK)
        run: flutter build apk --release

      - name: Upload dos Artefatos (iOS e Android)
        uses: actions/upload-artifact@v4
        with:
          name: assistec-mobile-artifacts
          path: |
            Assistec-iOS.ipa
            Runner.zip
            build/app/outputs/flutter-apk/app-release.apk
