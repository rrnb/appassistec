name: Build iOS (Assistec Mobile)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar App iOS (macOS Runner)
    runs-on: macos-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache artefatos iOS
        run: flutter precache --ios

      - name: Limpar e Recriar arquivos nativos iOS e dependências
        working-directory: ./mobile
        run: |
          echo "Removendo pasta ios antiga..."
          rm -rf ios
          
          echo "Recriando plataforma iOS..."
          flutter create . --org br.com.assistec --platforms=ios
          
          echo "Baixando dependências do Dart..."
          flutter pub get
          
          echo "Executando pod install..."
          cd ios
          pod install --repo-update || pod install

      - name: Compilar iOS (sem assinatura para teste)
        working-directory: ./mobile
        run: flutter build ios --release --no-codesign

      - name: Compactar App iOS em ZIP
        working-directory: ./mobile/build/ios/iphoneos
        run: zip -r Runner.zip Runner.app

      - name: Upload iOS App como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: assistec-mobile-ios-app
          path: mobile/build/ios/iphoneos/Runner.zip
