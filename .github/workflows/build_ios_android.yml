name: Build iOS

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build_ios:
    name: Compilar App Flutter para iOS
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile

    env:
      FLUTTER_VERSION: "3.24.5"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validar estrutura do projeto
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml || { echo "pubspec.yaml não encontrado"; exit 1; }
          flutter --version
          flutter doctor -v

      - name: Instalar dependências do Flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Preparar projeto iOS
        shell: bash
        run: |
          set -euo pipefail
          flutter precache --ios

          if [ ! -f ios/Podfile ]; then
            echo "Podfile ausente; recriando o scaffold iOS incompleto."

            if [ -f ios/Runner/Info.plist ]; then
              cp ios/Runner/Info.plist "$RUNNER_TEMP/Assistec-Info.plist"
            fi

            rm -rf ios
            flutter create \
              --platforms=ios \
              --org br.com.assistec \
              --project-name mobile \
              .

            if [ -f "$RUNNER_TEMP/Assistec-Info.plist" ]; then
              cp "$RUNNER_TEMP/Assistec-Info.plist" ios/Runner/Info.plist
            fi
          fi

          if [ ! -f ios/Podfile ]; then
            echo "Erro: ios/Podfile continua ausente após gerar o scaffold iOS."
            find ios -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi

          flutter pub get
          cd ios
          pod install --repo-update

      - name: Compilar iOS (sem assinatura para teste)
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign

      - name: Empacotar artefatos iOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Assistec-iOS.ipa Payload
          (
            cd build/ios/iphoneos
            zip -r "$RUNNER_TEMP/Runner.zip" Runner.app
          )
          mv "$RUNNER_TEMP/Runner.zip" Runner.zip

      - name: Upload dos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: assistec-mobile-build-artifacts
          path: |
            mobile/Assistec-iOS.ipa
            mobile/Runner.zip
            mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
